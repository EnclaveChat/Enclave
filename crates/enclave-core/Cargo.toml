[package]
name = "enclave-core"
description = "Enclave client engine: accounts, contacts, sessions, messaging and sync over the sealed store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-wire = { path = "../enclave-wire" }
enclave-rpc = { path = "../enclave-rpc" }
enclave-push-relay = { path = "../enclave-push-relay" }
enclave-proto = { path = "../enclave-proto" }
enclave-tokens = { path = "../enclave-tokens" }
enclave-net = { path = "../enclave-net" }
enclave-store = { path = "../enclave-store" }
enclave-kt = { path = "../enclave-kt" }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
enclave-sim = { path = "../enclave-sim" }
enclave-server = { path = "../enclave-server", features = ["test-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
