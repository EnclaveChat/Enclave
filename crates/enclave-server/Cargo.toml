[package]
name = "enclave-server"
description = "Enclave server: inboxes, request inboxes, blobs, directory and key transparency, reached only through sealed requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
enclave-crypto = { path = "../enclave-crypto" }
enclave-wire = { path = "../enclave-wire" }
enclave-rpc = { path = "../enclave-rpc" }
enclave-proto = { path = "../enclave-proto" }
enclave-tokens = { path = "../enclave-tokens" }
enclave-kt = { path = "../enclave-kt" }
enclave-service = { path = "../enclave-service" }
enclave-federation = { path = "../enclave-federation" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
thiserror = "2"
redb = "4.3.0"
serde = { version = "1", features = ["derive"] }
zeroize = "1"

[features]
# Lets tests play a dishonest operator (rebind a username without checks).
# Never enabled in builds that ship.
test-hooks = []

[[bin]]
name = "enclave-server"
path = "src/main.rs"
