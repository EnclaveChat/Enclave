name: CI
# TODO(M10): pin every action to a full commit SHA once verified.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system OpenSSL (test oracle only) and UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - name: Label registry matches code
        run: cargo xtask labels
      - name: Render UI screenshots (software renderer, light and dark)
        run: cargo run --release -p enclave-app --bin enclave-shots -- target/shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/shots

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  repro:
    name: reproducible builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Two clean builds of each binary must be byte-identical
        run: |
          cargo xtask repro enclave-relay
          cargo xtask repro enclave-server

  proverif:
    name: formal models (ProVerif)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Install ProVerif
        run: sudo apt-get update && sudo apt-get install -y proverif
      - name: Every query gives its expected result
        run: cargo xtask proverif
